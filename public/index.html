<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thế Giới Gacha Gối Ôm</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @keyframes bounce-crazy {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-crazy { animation: bounce-crazy 2s infinite; }
        .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Fix lỗi Safe Area trên iPhone đời mới */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 select-none overflow-hidden h-[100dvh] flex flex-col md:flex-row">
    
    <div id="online-count-display" 
         class="fixed bottom-[90px] left-3 md:bottom-4 md:left-4 z-[40] 
                bg-black/60 backdrop-blur-sm text-white px-3 py-1.5 
                rounded-full text-[10px] font-bold border border-white/10 
                hidden flex items-center gap-1.5 shadow-lg 
                transition-opacity hover:opacity-100 select-none pointer-events-none">
        <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
        </span>
        <span id="online-number">1 Online</span>
    </div>

    <audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.m4a"></audio>
    <audio id="snd-gacha-roll" src="https://assets.mixkit.co/active_storage/sfx/2048/2048-preview.m4a"></audio>
    <audio id="snd-gacha-result" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.m4a"></audio>

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-max max-w-[90vw]"></div>

    <div class="hidden md:flex flex-col w-72 bg-white shadow-[10px_0_20px_rgba(0,0,0,0.03)] z-20 relative border-r border-slate-100">
        <div class="p-6 border-b border-slate-100 bg-slate-50">
            <h1 class="text-2xl font-black text-indigo-600 flex items-center gap-2 drop-shadow-sm">
                <i data-lucide="sparkles"></i> PillowWorld
            </h1>
            <div class="mt-4 flex items-center gap-2 bg-slate-800 p-3 rounded-xl text-yellow-400 font-black shadow-inner">
                <i data-lucide="coins" width="20"></i>
                <span class="coin-display tracking-wider text-lg">...</span> Xu
            </div>
        </div>
        <div class="flex-1 py-4 space-y-2 px-2 overflow-y-auto no-scrollbar">
            <button onclick="setTab('gacha')" data-tab="gacha" class="sidebar-btn rounded-xl"><i data-lucide="sparkles" width="20"></i><span class="font-bold">Gacha</span></button>
            <button onclick="setTab('collection')" data-tab="collection" class="sidebar-btn rounded-xl"><i data-lucide="library" width="20"></i><span class="font-bold">Bộ Sưu Tập</span></button>
            <button onclick="setTab('games')" data-tab="games" class="sidebar-btn rounded-xl"><i data-lucide="gamepad-2" width="20"></i><span class="font-bold">Khu Vui Chơi</span></button>
            <button onclick="setTab('profile')" data-tab="profile" class="sidebar-btn rounded-xl"><i data-lucide="user" width="20"></i><span class="font-bold">Tài Khoản</span></button>
            <button onclick="setTab('exchange')" data-tab="exchange" class="sidebar-btn rounded-xl"><i data-lucide="ticket" width="20"></i><span class="font-bold">Nhập Code</span></button>
            <button onclick="setTab('admin')" data-tab="admin" class="sidebar-btn admin-nav-item rounded-xl bg-slate-900 text-white hover:bg-slate-800 hidden"><i data-lucide="shield-alert" width="20" class="text-red-400"></i><span class="font-bold text-red-400">Quản Trị</span></button>
        </div>
    </div>

    <div class="flex-1 relative h-full bg-slate-50 overflow-hidden flex flex-col">
        <div class="md:hidden h-14 bg-white/90 backdrop-blur border-b border-slate-200 flex items-center justify-between px-4 z-[40] shrink-0">
            <div class="font-black text-indigo-600 text-lg flex items-center gap-2">
                <i data-lucide="sparkles" width="20"></i> PillowWorld
            </div>
            <div class="flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-full text-yellow-400 font-black text-xs shadow-inner">
                <i data-lucide="coins" width="14"></i>
                <span class="coin-display tracking-wider">...</span>
            </div>
        </div>
        
        <div id="main-content" class="flex-1 relative z-10 overflow-hidden h-full"></div>
    </div>

    <div class="md:hidden fixed bottom-0 left-0 right-0 h-[70px] bg-white border-t border-slate-200 flex justify-around z-[50] pb-safe shadow-[0_-10px_30px_rgba(0,0,0,0.1)]">
        
        <button onclick="setTab('gacha')" data-tab="gacha" class="nav-btn flex flex-col items-center justify-center w-full active:bg-slate-50">
            <i data-lucide="sparkles" width="22"></i><span class="text-[10px] font-black mt-1">Gacha</span>
        </button>
        
        <button onclick="setTab('collection')" data-tab="collection" class="nav-btn flex flex-col items-center justify-center w-full active:bg-slate-50">
            <i data-lucide="library" width="22"></i><span class="text-[10px] font-black mt-1">Túi Đồ</span>
        </button>
        
        <button onclick="setTab('games')" data-tab="games" class="nav-btn flex flex-col items-center justify-center w-full active:bg-slate-50">
            <i data-lucide="gamepad-2" width="22"></i><span class="text-[10px] font-black mt-1">Game</span>
        </button>

        <button onclick="setTab('exchange')" data-tab="exchange" class="nav-btn flex flex-col items-center justify-center w-full active:bg-slate-50">
            <i data-lucide="ticket" width="22"></i><span class="text-[10px] font-black mt-1">Code</span>
        </button>
        <button onclick="setTab('profile')" data-tab="profile" class="nav-btn flex flex-col items-center justify-center w-full active:bg-slate-50">
            <i data-lucide="user" width="22"></i><span class="text-[10px] font-black mt-1">Acc</span>
        </button>
        
    </div>

    <script src="client.js"></script>
</body>
</html>
